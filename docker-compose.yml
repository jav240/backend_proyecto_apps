services:
  postgres-db:
    image: postgres:17-alpine
    container_name: postgres_capebe
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  usuarios-service:
    build: ./usuarios-service
    container_name: ms_usuarios
    restart: always
    depends_on:
      postgres-db:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_NAME: ${USUARIOS_DB_NAME:-usuariosBD}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DDL_AUTO: update
      SHOW_SQL: "false"
      JWT_SECRET: ${JWT_SECRET:-cambia-esto-por-un-secreto-largo-y-seguro}
      TOKEN_TTL_SECONDS: ${TOKEN_TTL_SECONDS:-604800}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-cashupinadmin@gmail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin12345}
      RECUPERACION_MOSTRAR_CODIGO: ${RECUPERACION_MOSTRAR_CODIGO:-true}
      VUELOS_SERVICE_URL: http://vuelos-operacion-service:8082

  vuelos-operacion-service:
    build: ./vuelos-operacion-service
    container_name: ms_vuelos_operacion
    restart: always
    depends_on:
      postgres-db:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      PORT: 8082
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_NAME: ${VUELOS_DB_NAME:-vuelosBD}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DDL_AUTO: update
      SHOW_SQL: "false"
      JWT_SECRET: ${JWT_SECRET:-cambia-esto-por-un-secreto-largo-y-seguro}
      TOKEN_TTL_SECONDS: ${TOKEN_TTL_SECONDS:-604800}
      USUARIOS_SERVICE_URL: http://usuarios-service:8081

  api-gateway:
    image: nginx:1.27-alpine
    container_name: api_gateway_capebe
    restart: always
    depends_on:
      - usuarios-service
      - vuelos-operacion-service
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
